name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The manager targets Windows, but development happens on macOS. Building on a
  # Windows runner avoids cross-compiling Electron entirely.
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: tidepool-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  # Cutting the release from the runner keeps the installer off anyone's laptop:
  # it is built and published in the same place, and never round-trips.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: tidepool-windows
          path: dist-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-release
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "TidePool ${GITHUB_REF_NAME}" \
            --notes-file docs/launch/release-notes.md \
            $PRERELEASE
