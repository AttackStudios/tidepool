name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The manager targets Windows, but development happens on macOS. Building on a
  # Windows runner avoids cross-compiling Electron entirely.
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Without this the artifacts carry package.json's version while the release
      # carries the tag's, so v0.1.0 ships a file called 0.0.1.
      - name: Match package version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "building version $VERSION"
      - run: npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: tidepool-windows
          path: |
            release/*.exe
            release/*.zip
            release/latest*.yml
          if-no-files-found: error

  # Cutting the release from the runner keeps the installer off anyone's laptop:
  # it is built and published in the same place, and never round-trips.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: tidepool-windows
          path: dist-release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-release
          PRERELEASE=""
          IS_PRE=false
          case "${GITHUB_REF_NAME}" in *-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease"; IS_PRE=true ;; esac

          # Idempotent on purpose. A re-run, or a tag that was moved after a
          # first build already published, would otherwise fail with "a release
          # with the same tag name already exists" -- leaving a release standing
          # that contains the wrong build.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release exists; replacing its assets with this build."
            gh release upload "${GITHUB_REF_NAME}" dist-release/* --clobber
            # --draft=false is not redundant. Deleting a tag turns its published
            # release back into a draft, and a draft is invisible to the
            # anonymous API -- so the download page stays locked and every asset
            # link 404s, while the announcement still goes out. Re-tagging after
            # a bad build is exactly when that would happen.
            gh release edit "${GITHUB_REF_NAME}" \
              --title "TidePool ${GITHUB_REF_NAME}" \
              --notes-file docs/launch/release-notes.md \
              --draft=false \
              --prerelease="${IS_PRE}"
          else
            gh release create "${GITHUB_REF_NAME}" dist-release/* \
              --title "TidePool ${GITHUB_REF_NAME}" \
              --notes-file docs/launch/release-notes.md \
              $PRERELEASE
          fi

      # Announced here rather than from an `on: release` workflow. GitHub will
      # not raise workflow-triggering events for anything created with
      # GITHUB_TOKEN, so a release published by this job never fires one -- the
      # 1.0 announcement would simply never have posted.
      - name: Announce to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_BETA: ${{ secrets.DISCORD_WEBHOOK_BETA }}
          BETA_ROLE_ID: ${{ secrets.BETA_ROLE_ID }}
        run: python3 tools/announce.py "${GITHUB_REF_NAME}"
