name: release-watch

# Watches for Surf Sandbox (Steam app 4480760) going purchasable.
#
# This originally watched the demo (app 4773830), hoping for an early Unity build
# to start the loader work against. nocanwin has confirmed that demo was built for
# Next Fest and was pulled after a couple of weeks, so it is not coming back —
# day one is genuinely day one. Repointed at the full game instead, which at least
# tells us the moment it is actually buyable rather than trusting the store date.
#
# It lives in Actions rather than a scheduled cloud agent because that
# environment's egress proxy blocks store.steampowered.com outright, so it could
# never observe the thing it was watching. Actions runners have open egress and
# gh preinstalled.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the :00 mark where every scheduled job piles up
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the game is purchasable
        id: check
        run: |
          set -euo pipefail
          BODY=$(curl -sS --max-time 25 \
            "https://store.steampowered.com/api/appdetails?appids=4480760&cc=us&l=en")
          echo "$BODY" > demo.json

          # The store page already exists, so "success" is not the signal here.
          # coming_soon flipping false is what marks the game as actually released.
          LIVE=$(python3 -c "
          import json
          d = json.load(open('demo.json')).get('4480760', {})
          rd = d.get('data', {}).get('release_date', {}) if d.get('success') else {}
          print('no' if not d.get('success') or rd.get('coming_soon', True) else 'yes')
          ")
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "Released: $LIVE"

          if [ "$LIVE" = "yes" ]; then
            python3 -c "
          import json
          a = json.load(open('demo.json'))['4480760']['data']
          rd = a.get('release_date', {})
          print('name=%s' % a.get('name'))
          print('type=%s' % a.get('type'))
          print('release=%s' % rd.get('date'))
          print('free=%s' % a.get('is_free'))
          print('platforms=%s' % a.get('platforms'))
          " > details.txt
            cat details.txt
          fi

      # Without this the watcher would open a fresh issue every hour, for ever.
      - name: Has it already been reported?
        if: steps.check.outputs.live == 'yes'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "Surf Sandbox is out in:title" --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Open the notification issue
        id: issue
        if: steps.check.outputs.live == 'yes' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Surf Sandbox is released and purchasable:"
            echo "https://store.steampowered.com/app/4480760/"
            echo
            echo '```'
            cat details.txt
            echo '```'
            echo
            echo "### Do this first"
            echo
            echo "Determine the scripting backend — it decides how much of day one is"
            echo "reverse-engineering:"
            echo
            echo "- \`<Name>_Data/Managed/Assembly-CSharp.dll\` → **Mono**, decompiles readably in ILSpy or Rider"
            echo "- \`GameAssembly.dll\` → **IL2CPP**, needs Il2CppDumper first (about a day more work)"
            echo
            echo "Also note the Unity version from \`globalgamemanagers\`, and whether Steamworks"
            echo "assemblies are present — that decides the multiplayer transport."
            echo
            echo "### Why this matters"
            echo
            echo "Follow \`docs/launch/00-checklist.md\` from H+0:00. The launch copy is written"
            echo "and \`npm run launch:check\` will refuse to let a placeholder ship."
            echo
            echo "### Getting it onto macOS"
            echo
            echo "No Windows machine needed — force the platform type:"
            echo
            echo '```sh'
            echo "steamcmd +@sSteamCmdForcePlatformType windows +login <user> +app_update 4480760 validate +quit"
            echo '```'
          } > issue.md

          # Assign and mention: both notify regardless of watch settings, whereas a
          # plain issue only notifies if you happen to be watching All Activity.
          echo "" >> issue.md
          echo "cc @${GITHUB_REPOSITORY_OWNER}" >> issue.md

          URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Surf Sandbox is out - start triage" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body-file issue.md)
          echo "issue=$URL" >> "$GITHUB_OUTPUT"
          echo "Opened $URL"

      # Reaches a phone (and therefore a watch) far more reliably than email.
      # Skipped silently when the secret is absent, so this is safe to leave in.
      - name: Push to Discord
        if: steps.check.outputs.live == 'yes' && steps.existing.outputs.count == '0'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "No DISCORD_WEBHOOK secret set — skipping push."
            exit 0
          fi
          python3 - <<'PY' > payload.json
          import json
          print(json.dumps({
            "content": "**Surf Sandbox is out.** Triage issue opened — "
                       "first job is Mono vs IL2CPP.\n"
                       "https://store.steampowered.com/app/4480760/"
          }))
          PY
          curl -sS -X POST -H "Content-Type: application/json" \
            -d @payload.json "$WEBHOOK" && echo "Pushed to Discord."

      - name: Summary
        run: |
          echo "Released: ${{ steps.check.outputs.live }}" >> "$GITHUB_STEP_SUMMARY"
