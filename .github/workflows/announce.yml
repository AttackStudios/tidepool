name: announce

# Posts a release to Discord when one is published.
#
# Releases are the event a community server actually wants; commits and issues
# are noise there. If you do want those, Discord's native GitHub integration
# handles them with no code — see docs/launch/discord-webhook.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to announce (for re-posting a release)'
        required: true

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WEBHOOK_BETA: ${{ secrets.DISCORD_WEBHOOK_BETA }}
          BETA_ROLE_ID: ${{ secrets.BETA_ROLE_ID }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "No DISCORD_WEBHOOK secret set — nothing to post to. Skipping."
            exit 0
          fi

          # Read the release back from the API rather than trusting the event
          # payload, so a manual re-post works identically to an automatic one.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isPrerelease,url,assets > release.json

          python3 - <<'PY' > payload.json
          import io, json, os

          r = json.load(open('release.json'))
          tag = r['tagName']
          prerelease = r['isPrerelease']

          # Trim the notes: Discord embeds cap at 4096 and a wall of text in a
          # channel is worse than a link.
          body = (r.get('body') or '').strip()
          if len(body) > 1400:
              body = body[:1400].rsplit('\n', 1)[0] + '\n\n…'

          # .yml files are updater manifests, not something a human downloads.
          assets = [a for a in r.get('assets', []) if not a['name'].endswith('.yml')]
          downloads = '\n'.join(
              f"[{a['name']}]({a['url']}) · {a['size'] // 1024 // 1024} MB" for a in assets
          )

          # 1.0 is not just another release — it is the announcement the server
          # has been waiting for, so it gets written copy rather than a changelog.
          launch = not prerelease and tag.lstrip('v').split('-')[0] == '1.0.0'

          # Only pings if the role id is configured; an unset secret must not
          # post a broken literal like "<@&>".
          role = os.environ.get('BETA_ROLE_ID', '').strip()
          mentions = {'parse': []}

          if launch:
              content = (
                  '@everyone\n'
                  '# 🌊  TidePool 1.0 is out\n'
                  '-# The first mod manager for Surf Sandbox — shipping the day the game does.'
              )
              title = 'TidePool 1.0 — out now'
              description = (
                  '**Install mods without ever opening a folder.**\n'
                  'Dependencies resolve themselves, profiles keep your setups apart, and the '
                  'game launches straight from the app.\n\n'
                  '**·**  Browse every mod and install in one click\n'
                  '**·**  Separate profiles — swap whole setups instantly\n'
                  '**·**  Share a profile or a beach with a single code\n'
                  '**·**  Free, open source, no account needed\n'
              )
              if downloads:
                  description += '\n**Downloads**\n' + downloads
              description += '\n\n[Full release notes](%s)' % r['url']
              color = 0x3fd8e8
              mentions = {'parse': ['everyone']}
          elif prerelease:
              # Goes to the beta channel, which only Beta Testers can see.
              content = (('<@&%s>\n' % role) if role else '') + '## 🧪  New beta build'
              title = 'Beta build — ' + (r.get('name') or tag)
              description = body or 'No notes for this build.'
              if downloads:
                  description += '\n\n**Downloads**\n' + downloads
              description += (
                  '\n\n-# Unfinished build. Export your profiles before installing it, '
                  'and keep these files in this channel — they are not for sharing.'
              )
              color = 0xf2b45a
              if role:
                  mentions = {'parse': [], 'roles': [role]}
          else:
              content = '@everyone'
              title = r.get('name') or tag
              description = body or 'No release notes.'
              if downloads:
                  description += '\n\n**Downloads**\n' + downloads
              color = 0x3fd8e8
              mentions = {'parse': ['everyone']}

          payload = {
              # No username/avatar override: each webhook carries its own
              # identity, so the beta channel posts as TidePool Beta by itself.
              'content': content,
              'allowed_mentions': mentions,
              'embeds': [{
                  'title': title,
                  'url': r['url'],
                  'description': description,
                  'color': color,
                  'footer': {'text': 'tidepool · attackstudios.github.io/tidepool'},
              }],
          }
          io.open('target.txt', 'w').write('beta' if prerelease else 'main')
          print(json.dumps(payload))
          PY

          # Beta builds must not land in the public announcements channel.
          if [ "$(cat target.txt)" = "beta" ]; then
            TARGET="${WEBHOOK_BETA:-}"
            if [ -z "$TARGET" ]; then
              echo "Prerelease, but no DISCORD_WEBHOOK_BETA secret set. Skipping."
              exit 0
            fi
          else
            TARGET="$WEBHOOK"
          fi

          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d @payload.json "$TARGET")

          # A silent failure here means a release nobody hears about, so make it
          # fail the run rather than pass quietly.
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "Discord rejected the post (HTTP $code):"
            cat response.txt
            exit 1
          fi
          echo "Announced $TAG to Discord."
